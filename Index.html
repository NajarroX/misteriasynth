<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>MISTERIA | Oscilador Alienígena por Najarro X</title>
  <!-- Google Fonts: fuentes futuristas y modernas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1c20;
      font-family: 'Exo 2', 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
      background: radial-gradient(circle at 30% 10%, #262a33, #0b0d10);
      position: relative;
    }

    /* Efecto sutil de partículas estáticas en el fondo para atmósfera alienígena */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.08"><path d="M70 40 L75 35 L80 40 L75 45 Z" fill="%233aee88"/><circle cx="140" cy="80" r="1.8" fill="%23b7f0d0"/><path d="M25 130 L30 125 L35 130 L30 135 Z" fill="%2326a65b"/></svg>');
      background-size: 180px 180px;
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      background: #1f2229;
      border-radius: 3.5rem;
      padding: 2.2rem 2.5rem;
      box-shadow: 
        12px 12px 28px #0c0e11,
        -10px -10px 24px #2c303b,
        inset 2px 2px 5px rgba(0,0,0,0.5),
        inset -3px -3px 6px rgba(255,255,255,0.05);
      border: 1px solid rgba(74, 255, 140, 0.15);
      transition: all 0.2s ease;
      backdrop-filter: blur(2px);
    }

    /* Neumorphism nightmode + detalles alien */
    .title-section {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      border-bottom: 2px solid rgba(58, 238, 136, 0.25);
      padding-bottom: 0.7rem;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 2.4rem;
      letter-spacing: 0.4rem;
      color: #b3ffcf;
      text-shadow: 0 0 10px #1eff6e, 0 0 20px #0f7a3e;
      background: linear-gradient(180deg, #e0ffe8 0%, #6bcb8a 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(4px 4px 6px #0b0f0c);
    }

    .subtitle {
      font-family: 'Exo 2', sans-serif;
      font-weight: 300;
      font-size: 1.1rem;
      color: #8fc9a8;
      text-transform: uppercase;
      letter-spacing: 0.25rem;
      background: rgba(25, 30, 28, 0.6);
      padding: 0.3rem 1.2rem;
      border-radius: 3rem;
      box-shadow: inset 3px 3px 8px #0a0c0e, inset -2px -2px 5px #38404f;
    }

    .visualizer-panel {
      margin: 1.8rem 0 2.2rem;
      border-radius: 2.5rem;
      background: #171a1f;
      padding: 0.8rem;
      box-shadow: inset 8px 8px 16px #0b0d10, inset -6px -6px 14px #2f3540;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 130px;
      border-radius: 1.8rem;
      background: #0a0c0b;
      box-shadow: 0 0 18px #1aff6e, 0 0 5px #00b85c;
      filter: drop-shadow(0 0 6px #2bff7c);
      transition: box-shadow 0.2s;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.5rem;
      margin: 2.2rem 0 1.5rem;
    }

    .knob-area {
      background: #1f2229;
      border-radius: 2.2rem;
      padding: 1.2rem 0.7rem 0.9rem;
      box-shadow: 8px 8px 20px #101215, -8px -8px 20px #2e3440;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.1s linear;
    }

    .knob-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      color: #9edfb5;
      letter-spacing: 0.1rem;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 5px #0b331c;
    }

    input[type="range"] {
      width: 90%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      margin: 0.3rem 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      background: #1b1e24;
      border-radius: 10px;
      box-shadow: inset 2px 2px 6px #090b0d, inset -1px -1px 3px #444c5a;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      background: #2bff7c;
      border-radius: 50%;
      margin-top: -7px;
      box-shadow: 0 0 18px #23d46b, 0 0 6px #000, 3px 3px 8px #0d0f12;
      border: 1px solid #b3ffcf;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: #2bff7c;
      border-radius: 50%;
      box-shadow: 0 0 18px #23d46b, 0 0 6px #000;
      border: 1px solid #b3ffcf;
      cursor: pointer;
    }

    .value-display {
      font-family: 'Exo 2', monospace;
      font-weight: 600;
      color: #bbf7d5;
      background: #13161b;
      padding: 0.15rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-top: 0.2rem;
      box-shadow: inset 2px 2px 5px #000000;
    }

    /* Secuenciador por pasos */
    .sequencer-section {
      margin: 2rem 0 1.5rem;
      background: #1a1d24;
      border-radius: 2rem;
      padding: 1.5rem 1.2rem;
      box-shadow: inset 6px 6px 12px #0e1014, inset -4px -4px 10px #2a2f3a;
    }

    .sequencer-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #7ae9a0;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.15rem;
      text-shadow: 0 0 8px #1aff6e;
    }

    .steps-container {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }

    .step-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .step-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      color: #5a7d6b;
      letter-spacing: 0.05rem;
    }

    .step-note {
      width: 45px;
      height: 45px;
      border-radius: 1rem;
      background: #1f2229;
      border: 2px solid #2a2f38;
      box-shadow: 4px 4px 8px #0d0f13, -3px -3px 6px #2b313d;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: #8fffbc;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s ease;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
    }

    .step-note:focus {
      border-color: #1eff6e;
      box-shadow: 0 0 15px #1aff6e, inset 2px 2px 4px #0a0c0e;
    }

    .step-note.active-step {
      background: #0f331c;
      border-color: #1eff6e;
      box-shadow: 0 0 20px #1aff6e, 0 0 10px #00b85c;
      color: #ffffff;
      text-shadow: 0 0 6px #00ff6a;
    }

    .sequencer-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .tempo-knob {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #1f2229;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      box-shadow: 3px 3px 8px #0e1013, -2px -2px 6px #2c3240;
    }

    .tempo-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      color: #6bcb8a;
    }

    #tempoSlider {
      width: 100px;
    }

    .alien-mutation-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1.5rem 0 0.8rem;
      flex-wrap: wrap;
    }

    .mutant-btn {
      background: #1f2229;
      border: none;
      border-radius: 3rem;
      padding: 0.7rem 1.6rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.15rem;
      color: #adf0c9;
      box-shadow: 6px 6px 16px #0b0d10, -5px -5px 14px #2f3645;
      cursor: pointer;
      transition: all 0.08s ease;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .mutant-btn:active {
      box-shadow: inset 5px 5px 10px #080a0d, inset -4px -4px 10px #303745;
      color: #dcffeb;
      text-shadow: 0 0 10px #00ff6a;
    }

    .secret-differentiator {
      font-size: 0.8rem;
      background: #0f1319;
      border-radius: 1rem;
      padding: 0.3rem 1.4rem;
      color: #7ae9a0;
      text-align: center;
      margin-top: 1rem;
      font-family: 'Exo 2';
      letter-spacing: 0.1rem;
      box-shadow: inset 0 0 12px #0c0f0e;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      color: #5e7d6b;
      font-size: 0.7rem;
      margin-top: 1rem;
    }

    @media (max-width: 500px) {
      .main-container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.8rem;
      }
      .step-note {
        width: 35px;
        height: 35px;
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
<div class="main-container">
  <div class="title-section">
    <h1>MISTERIA</h1>
    <div class="subtitle">por Najarro X</div>
  </div>

  <!-- Visualizador de oscilador verde neón con efecto dinámico -->
  <div class="visualizer-panel">
    <canvas id="oscilloscope" width="600" height="130"></canvas>
  </div>

  <!-- Controles para manipular el sonido -->
  <div class="controls-grid">
    <div class="knob-area">
      <span class="knob-label">FRECUENCIA</span>
      <input type="range" id="freqSlider" min="30" max="900" value="140" step="0.5">
      <span class="value-display" id="freqValue">140 Hz</span>
    </div>
    <div class="knob-area">
      <span class="knob-label">DETUNE ALIEN</span>
      <input type="range" id="detuneSlider" min="-100" max="100" value="15" step="0.5">
      <span class="value-display" id="detuneValue">15 ct</span>
    </div>
    <div class="knob-area">
      <span class="knob-label">RESONANCIA</span>
      <input type="range" id="resonanceSlider" min="0" max="40" value="8" step="0.1">
      <span class="value-display" id="resonanceValue">8.0</span>
    </div>
    <div class="knob-area">
      <span class="knob-label">REVERB CÓSMICO</span>
      <input type="range" id="reverbSlider" min="0" max="1.5" value="0.7" step="0.01">
      <span class="value-display" id="reverbValue">0.70</span>
    </div>
  </div>

  <!-- NUEVO: Secuenciador por pasos personalizable de 8 compases -->
  <div class="sequencer-section">
    <div class="sequencer-title">⚙️ SECUENCIADOR DE 8 PASOS</div>
    <div class="steps-container" id="stepsContainer">
      <!-- Se generan dinámicamente con JavaScript -->
    </div>
    <div class="sequencer-controls">
      <div class="tempo-knob">
        <span class="tempo-label">TEMPO</span>
        <input type="range" id="tempoSlider" min="60" max="300" value="140" step="1">
        <span class="value-display" id="tempoValue">140 BPM</span>
      </div>
      <button class="mutant-btn" id="playSeqBtn">▶ PLAY SEC</button>
      <button class="mutant-btn" id="stopSeqBtn">⏹️ STOP</button>
    </div>
  </div>

  <!-- Diferenciador: mutación alienígena y secuenciador -->
  <div class="alien-mutation-row">
    <button class="mutant-btn" id="mutateBtn">🌀 MUTAR ONDA</button>
    <button class="mutant-btn" id="randomSeqBtn">🎲 SEC ALEATORIA</button>
  </div>
  <div class="secret-differentiator" id="alienMessage">
    ◈ ONDA HÍBRIDA: ALIENÍGENA ACTIVA ◈
  </div>
  <div class="footer-note">
    <span>🔮 neumorphism night</span>
    <span>⚡ latencia ultrabaja</span>
  </div>
</div>

<script>
  (function() {
    // ---------- CONTEXTO DE AUDIO ----------
    let audioCtx;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      alert("Tu navegador no soporta AudioContext. Prueba con Chrome/Firefox.");
      return;
    }

    // Nodo maestro de ganancia para control seguro
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.65;
    masterGain.connect(audioCtx.destination);

    // Nodo de reverberación convolucional simulado (efecto cósmico)
    const reverbNode = audioCtx.createConvolver();
    function createReverbImpulse(duration = 2.5, decay = 2.2) {
      const sampleRate = audioCtx.sampleRate;
      const length = sampleRate * duration;
      const impulse = audioCtx.createBuffer(2, length, sampleRate);
      for (let channel = 0; channel < 2; channel++) {
        const channelData = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) {
          const t = i / sampleRate;
          const randomFactor = (Math.random() * 2 - 1) * 0.25;
          channelData[i] = (Math.random() * 2 - 1) * Math.exp(-t * decay) * (0.7 + randomFactor);
        }
      }
      return impulse;
    }
    reverbNode.buffer = createReverbImpulse(2.8, 2.0);

    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.7;
    reverbNode.connect(reverbGain);
    reverbGain.connect(masterGain);

    const filterNode = audioCtx.createBiquadFilter();
    filterNode.type = "lowpass";
    filterNode.frequency.value = 800;
    filterNode.Q.value = 8;

    const waveShaper = audioCtx.createWaveShaper();
    function makeAlienCurve(amount = 0.9) {
      const samples = 256;
      const curve = new Float32Array(samples);
      for (let i = 0; i < samples; i++) {
        const x = (i * 2) / samples - 1;
        curve[i] = Math.tanh(amount * 4.5 * x) * 0.8 + 0.1 * Math.sin(x * 8);
      }
      return curve;
    }
    waveShaper.curve = makeAlienCurve(0.85);
    waveShaper.oversample = '2x';

    // Variables del oscilador
    let currentOscillator = null;
    let currentGainNode = null;
    let isPlaying = false;
    
    // Parámetros actuales
    let currentFrequency = 140;
    let currentDetune = 15;
    let currentResonance = 8;
    let currentReverbMix = 0.7;
    let currentWaveType = "alien1";
    
    // Secuenciador
    let sequencerNotes = ['C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'B3', 'C4'];
    let currentStep = 0;
    let sequencerInterval = null;
    let isSequencerPlaying = false;
    let currentTempo = 140;

    // Mapeo de notas a frecuencias
    const noteToFrequency = {
      'C2': 65.41, 'C#2': 69.30, 'D2': 73.42, 'D#2': 77.78, 'E2': 82.41, 'F2': 87.31,
      'F#2': 92.50, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'A#2': 116.54, 'B2': 123.47,
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61,
      'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23,
      'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25
    };

    const availableNotes = Object.keys(noteToFrequency);

    function createAlienPeriodicWave(waveVariant = 'alien1') {
      const real = new Float32Array(8);
      const imag = new Float32Array(8);
      
      if (waveVariant === 'alien1') {
        real[0] = 0;
        real[1] = 0.9;
        imag[1] = 0.35;
        real[2] = 0.15;
        imag[2] = -0.2;
        real[3] = 0.45;
        imag[3] = 0.18;
        real[4] = 0.12;
        imag[4] = -0.08;
        real[5] = 0.28;
        imag[5] = 0.11;
      } else if (waveVariant === 'alien2') {
        real[0] = 0.02;
        real[1] = 0.75;
        imag[1] = -0.45;
        real[2] = 0.22;
        imag[2] = 0.33;
        real[3] = 0.55;
        imag[3] = -0.24;
        real[4] = 0.08;
        imag[4] = 0.17;
        real[5] = 0.15;
        imag[5] = -0.19;
      } else if (waveVariant === 'alien3') {
        real[0] = 0.01;
        real[1] = 0.82;
        imag[1] = 0.15;
        real[2] = -0.28;
        imag[2] = 0.42;
        real[3] = 0.38;
        imag[3] = -0.33;
        real[4] = 0.19;
        imag[4] = 0.25;
        real[5] = 0.32;
        imag[5] = -0.11;
      } else if (waveVariant === 'dungeon') {
        real[0] = 0;
        real[1] = 0.88;
        imag[1] = -0.32;
        real[2] = -0.15;
        imag[2] = 0.09;
        real[3] = 0.24;
        imag[3] = 0.28;
        real[4] = 0.1;
        imag[4] = -0.2;
        real[5] = 0.17;
        imag[5] = 0.07;
      }
      return audioCtx.createPeriodicWave(real, imag, {disableNormalization: false});
    }

    function updateAlienMessage(wave) {
      const msgDiv = document.getElementById('alienMessage');
      if (msgDiv) {
        if (wave === 'alien1') msgDiv.innerText = '◈ ONDA HÍBRIDA: ENTIDAD ESPECTRAL ◈';
        else if (wave === 'alien2') msgDiv.innerText = '◈ ONDA HÍBRIDA: ABISMO CRISTALINO ◈';
        else if (wave === 'alien3') msgDiv.innerText = '◈ ONDA HÍBRIDA: NEBULOSA DISTORSIONADA ◈';
        else if (wave === 'dungeon') msgDiv.innerText = '◈ ONDA HÍBRIDA: CATACUMBAS ANCESTRALES ◈';
      }
    }

    function startOrUpdateOscillator(freq = currentFrequency) {
      if (!audioCtx) return;
      
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      if (currentOscillator) {
        try {
          currentOscillator.stop();
        } catch(e) {}
        currentOscillator.disconnect();
        if (currentGainNode) {
          currentGainNode.disconnect();
        }
      }
      
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      oscGain.gain.value = 0.55;
      
      try {
        const periodicWave = createAlienPeriodicWave(currentWaveType);
        osc.setPeriodicWave(periodicWave);
      } catch (e) {
        osc.type = "sawtooth";
      }
      
      osc.frequency.value = freq;
      osc.detune.value = currentDetune;
      
      osc.connect(oscGain);
      oscGain.connect(waveShaper);
      waveShaper.connect(filterNode);
      
      filterNode.connect(masterGain);
      filterNode.connect(reverbNode);
      
      filterNode.frequency.value = Math.min(2000, Math.max(200, freq * 2.2 + currentResonance * 18));
      filterNode.Q.value = currentResonance;
      reverbGain.gain.value = currentReverbMix * 0.9;
      
      osc.start();
      
      currentOscillator = osc;
      currentGainNode = oscGain;
      isPlaying = true;
      currentFrequency = freq;
    }

    function stopOscillator() {
      if (currentOscillator) {
        try { currentOscillator.stop(); } catch(e) {}
        currentOscillator.disconnect();
        currentOscillator = null;
      }
      if (currentGainNode) {
        currentGainNode.disconnect();
        currentGainNode = null;
      }
      isPlaying = false;
    }

    function ensureAudioRunning() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          if (!isPlaying && !isSequencerPlaying) startOrUpdateOscillator();
        });
      } else {
        if (!isPlaying && !isSequencerPlaying) startOrUpdateOscillator();
      }
    }

    function updateUI() {
      document.getElementById('freqValue').innerText = currentFrequency.toFixed(1) + ' Hz';
      document.getElementById('detuneValue').innerText = currentDetune.toFixed(1) + ' ct';
      document.getElementById('resonanceValue').innerText = currentResonance.toFixed(1);
      document.getElementById('reverbValue').innerText = currentReverbMix.toFixed(2);
      
      if (isPlaying && !isSequencerPlaying) {
        if (currentOscillator) {
          currentOscillator.frequency.value = currentFrequency;
          currentOscillator.detune.value = currentDetune;
          filterNode.frequency.value = Math.min(2000, Math.max(200, currentFrequency * 2.2 + currentResonance * 18));
          filterNode.Q.value = currentResonance;
          reverbGain.gain.value = currentReverbMix * 0.9;
        }
      }
    }

    // Generar interfaz del secuenciador
    function createSequencerUI() {
      const container = document.getElementById('stepsContainer');
      container.innerHTML = '';
      
      sequencerNotes.forEach((note, index) => {
        const stepBox = document.createElement('div');
        stepBox.className = 'step-box';
        
        const stepNumber = document.createElement('div');
        stepNumber.className = 'step-number';
        stepNumber.textContent = `${index + 1}`;
        
        const noteInput = document.createElement('input');
        noteInput.type = 'text';
        noteInput.className = 'step-note';
        noteInput.value = note;
        noteInput.maxLength = 3;
        noteInput.dataset.index = index;
        
        noteInput.addEventListener('input', (e) => {
          const newNote = e.target.value.toUpperCase();
          if (availableNotes.includes(newNote)) {
            sequencerNotes[index] = newNote;
            e.target.classList.remove('invalid-note');
          } else if (newNote.length === 0) {
            sequencerNotes[index] = 'C3';
            e.target.value = 'C3';
          } else {
            e.target.classList.add('invalid-note');
          }
        });
        
        noteInput.addEventListener('focus', (e) => {
          e.target.select();
        });
        
        noteInput.addEventListener('blur', (e) => {
          const newNote = e.target.value.toUpperCase();
          if (!availableNotes.includes(newNote)) {
            e.target.value = sequencerNotes[index];
          }
          e.target.classList.remove('invalid-note');
        });
        
        stepBox.appendChild(stepNumber);
        stepBox.appendChild(noteInput);
        container.appendChild(stepBox);
      });
    }

    // Actualizar paso activo en la UI
    function updateActiveStep(step) {
      const allNotes = document.querySelectorAll('.step-note');
      allNotes.forEach((noteEl, index) => {
        if (index === step) {
          noteEl.classList.add('active-step');
        } else {
          noteEl.classList.remove('active-step');
        }
      });
    }

    // Reproducir secuenciador
    function startSequencer() {
      if (isSequencerPlaying) return;
      
      stopOscillator();
      stopSequencer();
      
      isSequencerPlaying = true;
      currentStep = 0;
      
      const stepTime = (60 / currentTempo) * 1000 / 2; // semicorcheas
      
      const playStep = () => {
        if (!isSequencerPlaying) return;
        
        updateActiveStep(currentStep);
        
        const note = sequencerNotes[currentStep];
        const freq = noteToFrequency[note] || 220;
        
        startOrUpdateOscillator(freq);
        
        currentStep = (currentStep + 1) % 8;
      };
      
      playStep();
      sequencerInterval = setInterval(playStep, stepTime);
      
      document.getElementById('playSeqBtn').style.boxShadow = 'inset 5px 5px 10px #080a0d, inset -4px -4px 10px #303745';
    }

    function stopSequencer() {
      if (sequencerInterval) {
        clearInterval(sequencerInterval);
        sequencerInterval = null;
      }
      isSequencerPlaying = false;
      currentStep = 0;
      
      const allNotes = document.querySelectorAll('.step-note');
      allNotes.forEach(el => el.classList.remove('active-step'));
      
      document.getElementById('playSeqBtn').style.boxShadow = '6px 6px 16px #0b0d10, -5px -5px 14px #2f3645';
      
      stopOscillator();
    }

    // Secuencia aleatoria
    function randomizeSequence() {
      const dungeonNotes = ['C2', 'D2', 'E2', 'F2', 'G2', 'A2', 'C3', 'D3', 'E3', 'F3', 'G3', 'A3', 'C4'];
      for (let i = 0; i < 8; i++) {
        sequencerNotes[i] = dungeonNotes[Math.floor(Math.random() * dungeonNotes.length)];
      }
      
      const allInputs = document.querySelectorAll('.step-note');
      allInputs.forEach((input, index) => {
        input.value = sequencerNotes[index];
      });
    }

    // Event Listeners
    document.getElementById('freqSlider').addEventListener('input', (e) => {
      if (!isSequencerPlaying) {
        currentFrequency = parseFloat(e.target.value);
        updateUI();
        if (!isPlaying) ensureAudioRunning();
      }
    });
    
    document.getElementById('detuneSlider').addEventListener('input', (e) => {
      currentDetune = parseFloat(e.target.value);
      updateUI();
      if (!isPlaying && !isSequencerPlaying) ensureAudioRunning();
    });
    
    document.getElementById('resonanceSlider').addEventListener('input', (e) => {
      currentResonance = parseFloat(e.target.value);
      updateUI();
      if (!isPlaying && !isSequencerPlaying) ensureAudioRunning();
    });
    
    document.getElementById('reverbSlider').addEventListener('input', (e) => {
      currentReverbMix = parseFloat(e.target.value);
      updateUI();
      if (!isPlaying && !isSequencerPlaying) ensureAudioRunning();
    });

    document.getElementById('tempoSlider').addEventListener('input', (e) => {
      currentTempo = parseInt(e.target.value);
      document.getElementById('tempoValue').innerText = currentTempo + ' BPM';
      
      if (isSequencerPlaying) {
        stopSequencer();
        startSequencer();
      }
    });

    document.getElementById('playSeqBtn').addEventListener('click', () => {
      ensureAudioRunning();
      startSequencer();
    });

    document.getElementById('stopSeqBtn').addEventListener('click', () => {
      stopSequencer();
    });

    document.getElementById('mutateBtn').addEventListener('click', () => {
      const waves = ['alien1', 'alien2', 'alien3', 'dungeon'];
      const currentIdx = waves.indexOf(currentWaveType);
      const nextIdx = (currentIdx + 1) % waves.length;
      currentWaveType = waves[nextIdx];
      updateAlienMessage(currentWaveType);
      
      if (isPlaying || isSequencerPlaying) {
        stopOscillator();
        if (isSequencerPlaying) {
          const freq = noteToFrequency[sequencerNotes[currentStep]] || 220;
          startOrUpdateOscillator(freq);
        } else {
          startOrUpdateOscillator();
        }
      } else {
        ensureAudioRunning();
      }
      updateUI();
    });

    document.getElementById('randomSeqBtn').addEventListener('click', () => {
      randomizeSequence();
    });

    // Canvas: visualizador
    const canvas = document.getElementById('oscilloscope');
    const ctx = canvas.getContext('2d');
    
    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      
      if (!canvas || !ctx) return;
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      ctx.shadowColor = '#1eff6e';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#8fffbc';
      ctx.lineWidth = 2.4;
      
      ctx.beginPath();
      
      const midY = height / 2;
      const freqFactor = currentFrequency / 200;
      const waveVariant = currentWaveType;
      
      for (let x = 0; x < width; x += 2) {
        const t = (x / width) * Math.PI * 2.5;
        let yOffset = 0;
        
        if (waveVariant === 'alien1') {
          yOffset = Math.sin(t * 3.2) * 20 + Math.cos(t * 7.1) * 7 + Math.sin(t * 1.7) * 15;
        } else if (waveVariant === 'alien2') {
          yOffset = Math.sin(t * 2.4) * 17 + Math.cos(t * 5.6) * 11 + Math.sin(t * 8.2) * 6;
        } else if (waveVariant === 'alien3') {
          yOffset = Math.sin(t * 4.1) * 22 + Math.cos(t * 2.9) * 9 + Math.sin(t * 11) * 4;
        } else if (waveVariant === 'dungeon') {
          yOffset = Math.sin(t * 1.8) * 14 + Math.cos(t * 4.5) * 12 + Math.sin(t * 6.3) * 8;
        }
        
        yOffset *= (0.7 + currentResonance * 0.03);
        yOffset *= (0.8 + freqFactor * 0.2);
        
        const y = midY + yOffset;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      
      ctx.stroke();
      
      ctx.beginPath();
      ctx.strokeStyle = '#2b5e3b';
      ctx.shadowBlur = 6;
      ctx.lineWidth = 1;
      ctx.moveTo(0, midY);
      ctx.lineTo(width, midY);
      ctx.stroke();
      
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }
    
    drawVisualizer();

    // Inicialización
    createSequencerUI();
    updateUI();
    updateAlienMessage('alien1');
    document.getElementById('tempoValue').innerText = currentTempo + ' BPM';
    
    document.querySelector('.main-container').addEventListener('click', () => {
      if (!isPlaying && !isSequencerPlaying) {
        ensureAudioRunning();
      }
    }, { once: false });
    
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (audioCtx.state === 'suspended') {
          console.log('AudioContext suspendido. Toca cualquier control para iniciar el sonido alienígena.');
        }
      }, 100);
    });

    window.addEventListener('beforeunload', () => {
      stopSequencer();
      stopOscillator();
      if (audioCtx) audioCtx.close();
    });
  })();
</script>
</body>
</html>
